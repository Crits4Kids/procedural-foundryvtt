name: Bug Report
description: Report something in PROCEDURAL! that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much of this as you can — it makes reproducing and fixing the issue much faster.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I click X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug.
      placeholder: |
        1. Create a Trope actor
        2. Drag a Talent item onto it
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: system-version
    attributes:
      label: PROCEDURAL! system version
      description: Found on the Setup screen's Game Systems tab, or in system.json.
      placeholder: "0.7.0"
    validations:
      required: true

  - type: input
    id: foundry-version
    attributes:
      label: Foundry VTT version
      placeholder: "v14.xxx"
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open your browser's developer console (F12) and paste any red error text here, if present.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, or anything else that might help.
